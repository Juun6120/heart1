<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f6">
  <title>心意成形</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #442d35;
      background: #fff6f6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 12% 18%, #ffe1e7 0, transparent 26rem),
        radial-gradient(ellipse at 88% 82%, #ffe6dd 0, transparent 28rem),
        #fff8f7;
    }

    .page {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px clamp(20px, 5vw, 64px) 36px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #9e6672;
      font-size: 13px;
      letter-spacing: .12em;
    }

    .brand-mark { color: #e77c8f; font-size: 19px; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(270px, .82fr) minmax(0, 1.18fr);
      align-items: center;
      gap: clamp(24px, 5vw, 70px);
      padding: 44px 0;
    }

    .intro { padding-bottom: 12px; }

    .eyebrow {
      margin: 0 0 15px;
      color: #d17786;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    h1 {
      margin: 0;
      color: #51343d;
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      font-size: clamp(38px, 5vw, 60px);
      font-weight: 500;
      letter-spacing: .06em;
      line-height: 1.22;
    }

    .description {
      max-width: 330px;
      margin: 20px 0 30px;
      color: #927d81;
      font-size: 15px;
      line-height: 1.9;
    }

    .date-form {
      display: flex;
      width: min(100%, 380px);
      padding: 6px;
      border: 1px solid #f1d8da;
      border-radius: 15px;
      background: rgb(255 255 255 / 84%);
      box-shadow: 0 10px 30px rgb(161 98 110 / 8%);
      transition: border-color .2s, box-shadow .2s;
    }

    .date-form:focus-within {
      border-color: #eaa0aa;
      box-shadow: 0 10px 30px rgb(161 98 110 / 13%);
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 12px 13px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #523841;
      font: inherit;
      font-size: 15px;
      letter-spacing: .04em;
    }

    input::placeholder { color: #c4aeb1; }

    button {
      padding: 0 19px;
      border: 0;
      border-radius: 10px;
      background: #dc8290;
      color: white;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button:hover { background: #ce6c7d; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #f3bac2; outline-offset: 3px; }

    .hint {
      min-height: 24px;
      margin: 11px 2px 0;
      color: #af969b;
      font-size: 12px;
      line-height: 1.7;
    }

    .hint.error { color: #c74e60; }

    .art {
      position: relative;
      display: grid;
      min-height: 480px;
      place-items: center;
      isolation: isolate;
    }

    .art::before {
      position: absolute;
      z-index: -1;
      width: min(90%, 480px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe9eb 0, rgb(255 236 237 / 68%) 45%, transparent 72%);
      content: "";
    }

    .heart {
      position: relative;
      width: min(100%, 530px);
      aspect-ratio: 1.13;
      filter: drop-shadow(0 13px 15px rgb(182 93 111 / 12%));
    }

    .heart-word {
      position: absolute;
      display: block;
      color: var(--color);
      font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      font-size: clamp(10px, 1.5vw, 15px);
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      opacity: var(--opacity);
      transform: translate(-50%, -50%) rotate(var(--angle));
      user-select: none;
      animation: appear .5s both;
      animation-delay: var(--delay);
    }

    .sparkle {
      position: absolute;
      color: #e7a0a8;
      font-size: 20px;
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .sparkle.one { top: 16%; left: 13%; }
    .sparkle.two { right: 12%; bottom: 19%; animation-delay: .9s; }
    .sparkle.three { top: 27%; right: 10%; font-size: 13px; animation-delay: 1.5s; }

    .result {
      min-height: 26px;
      margin: -4px 0 0;
      color: #bd7883;
      text-align: center;
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      font-size: 16px;
      letter-spacing: .18em;
    }

    footer {
      color: #bea8ab;
      font-size: 11px;
      letter-spacing: .08em;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translate(-50%, -45%) rotate(var(--angle)) scale(.7); }
      to { opacity: var(--opacity); transform: translate(-50%, -50%) rotate(var(--angle)) scale(1); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .45; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.12); }
    }

    @media (max-width: 720px) {
      .page { padding-top: 21px; }
      main {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 44px 0 24px;
      }
      .intro { text-align: center; }
      .description { margin: 14px auto 21px; }
      .date-form { margin: 0 auto; text-align: left; }
      .hint { margin-bottom: 0; }
      .art { min-height: 0; margin-top: -6px; }
      .heart { width: min(100%, 480px); }
      .result { margin-top: -14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="brand-mark" aria-hidden="true">♥</span><span>一份小小的心意</span></header>
    <main>
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">A HEART MADE OF WORDS</p>
        <h1 id="title">把名字<br>写成一颗心</h1>
        <p class="description">输入特别的日期，让名字在爱心里自由散落，拼成一份专属的小惊喜。</p>
        <form class="date-form" id="date-form">
          <label for="date-input" class="sr-only" hidden>输入日期</label>
          <input id="date-input" type="text" inputmode="numeric" autocomplete="off" placeholder="试试 2006.01.20" aria-describedby="hint">
          <button type="submit">生成爱心</button>
        </form>
        <p class="hint" id="hint" aria-live="polite">日期格式：年.月.日</p>
      </section>
      <section class="art" aria-label="名字组成的爱心">
        <span class="sparkle one" aria-hidden="true">✦</span>
        <span class="sparkle two" aria-hidden="true">✧</span>
        <span class="sparkle three" aria-hidden="true">✦</span>
        <div class="heart" id="heart" role="img" aria-label="输入日期后生成的文字爱心"></div>
        <p class="result" id="result" aria-live="polite"></p>
      </section>
    </main>
    <footer>愿每一份心意，都有自己的形状</footer>
  </div>

  <script>
    const namesByDate = {
      "2006.01.20": "饶俊",
      "2007.08.30": "童晨子",
      "2008.07.20": "傅结柔"
    };

    const form = document.querySelector("#date-form");
    const input = document.querySelector("#date-input");
    const heart = document.querySelector("#heart");
    const hint = document.querySelector("#hint");
    const result = document.querySelector("#result");
    const colors = ["#d66f82", "#c95e76", "#df8290", "#bd6379", "#e3919b"];

    function seededRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function showHeart(date) {
      const name = namesByDate[date];
      if (!name) {
        heart.replaceChildren();
        heart.setAttribute("aria-label", "没有找到对应日期的名字");
        result.textContent = "";
        hint.textContent = "没有找到这个日期，请检查后再试试。";
        hint.classList.add("error");
        return;
      }

      hint.textContent = "日期格式：年.月.日";
      hint.classList.remove("error");
      result.textContent = `为「${name}」写下一颗心`;
      heart.setAttribute("aria-label", `由${name}组成的爱心`);

      const random = seededRandom([...date].reduce((sum, char) => sum + char.charCodeAt(0), 0));
      const fragment = document.createDocumentFragment();
      const columns = 22;
      const rows = 21;

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const x = (column / (columns - 1)) * 2.5 - 1.25;
          const y = 1.12 - (row / (rows - 1)) * 2.15;
          const shape = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
          if (shape > 0) continue;

          const word = document.createElement("span");
          word.className = "heart-word";
          word.textContent = name;
          word.style.left = `${(column / (columns - 1)) * 100}%`;
          word.style.top = `${(row / (rows - 1)) * 100}%`;
          word.style.setProperty("--angle", `${Math.round((random() - 0.5) * 52)}deg`);
          word.style.setProperty("--opacity", (0.72 + random() * 0.28).toFixed(2));
          word.style.setProperty("--color", colors[Math.floor(random() * colors.length)]);
          word.style.setProperty("--delay", `${(random() * 0.22).toFixed(2)}s`);
          fragment.append(word);
        }
      }

      heart.replaceChildren(fragment);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const date = input.value.trim().replace(/[／/．。]/g, ".").replace(/\s+/g, "");
      input.value = date;
      showHeart(date);
    });

    input.addEventListener("input", () => {
      if (hint.classList.contains("error")) {
        hint.textContent = "日期格式：年.月.日";
        hint.classList.remove("error");
      }
    });

    showHeart("2006.01.20");
  </script>
</body>
</html>
